name: Release
# Releases happen on their own: merge a change to main that raises the version in package.json
# (and the four other version fields) and this workflow tags it, runs the tests, publishes the
# GitHub release with vetcode-skill.zip, puts the plugin on the `plugin` branch (the one the
# Claude plugin directory follows), and publishes the npm package with provenance.
# Pushes that keep the same version are skipped. Run it by hand from Actions to retry.
# npm uses trusted publishing (no token): on npmjs.com, @openyard/vetcode → Settings →
# Trusted publisher → GitHub Actions, repository openyard-cloud/vetcode, workflow release.yml.
# With "Allow npm publish" ticked there the version goes public at once; without it the version
# is staged and a maintainer approves it under account settings → Staged Packages.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: New version?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(node -p 'require("./package.json").version')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1 && npm view "$(node -p 'require("./package.json").name')@$v" version >/dev/null 2>&1; then
            echo "v$v is already released on GitHub and npm; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Every version field says the same
        if: steps.v.outputs.new == 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          bad=0
          check() { if [ "$2" != "$V" ]; then echo "::error file=$1::version $2, package.json says $V"; bad=1; fi; }
          check .claude-plugin/plugin.json "$(node -p 'require("./.claude-plugin/plugin.json").version')"
          check .claude-plugin/marketplace.json "$(node -p 'require("./.claude-plugin/marketplace.json").plugins[0].version')"
          check skills/vetcode/SKILL.md "$(sed -n 's/^ *version: "\(.*\)"/\1/p' skills/vetcode/SKILL.md)"
          check skills/vetcode/scripts/lib/index.mjs "$(sed -n 's/^export const VERSION = "\(.*\)";/\1/p' skills/vetcode/scripts/lib/index.mjs)"
          exit $bad
      - if: steps.v.outputs.new == 'true'
        run: npm test
      - name: Scan this repository with itself
        if: steps.v.outputs.new == 'true'
        run: node skills/vetcode/scripts/vet.mjs . --no-tools --fail-on high
      - name: Build the skill zip
        if: steps.v.outputs.new == 'true'
        run: npm run zip
      - name: Tag and GitHub release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" vetcode-skill.zip --clobber
          else
            gh release create "v$V" vetcode-skill.zip --target "$GITHUB_SHA" --title "vetcode $V" --generate-notes
          fi
      # The Claude plugin directory follows the `plugin` branch: only what the plugin installs
      # (manifest, skill, hooks and its own README), one commit whenever that changes.
      - name: Plugin branch
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/plugin/build.sh "$RUNNER_TEMP/plugin" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: npm publish
        if: steps.v.outputs.new == 'true'
        run: |
          name="$(node -p 'require("./package.json").name')"
          v="$(node -p 'require("./package.json").version')"
          if npm view "$name@$v" version >/dev/null 2>&1; then echo "$name@$v is already on npm"; exit 0; fi
          npm install -g npm@latest
          # npm hides why trusted publishing failed unless asked: keep the lines that say it.
          why() { grep -E "npm (verbose oidc|error|warn)|E[0-9]{3}|E_[A-Z_]+" "$1" | grep -v "Unknown user config" | tail -n 25 || true; }
          set +e
          npm publish --provenance --access public --loglevel verbose > publish.log 2>&1
          code=$?
          why publish.log
          if [ $code -eq 0 ]; then echo "$name@$v is published on npm."; exit 0; fi
          # A trusted publisher may be allowed to stage only: the version then waits on npmjs.com
          # (account settings, Staged Packages) for a maintainer to approve it with 2FA.
          npm stage publish --provenance --access public --loglevel verbose > stage.log 2>&1
          staged=$?
          why stage.log
          set -e
          if [ $staged -eq 0 ]; then
            echo "::warning title=npm: waiting for approval::$name@$v is staged, not public yet. Approve it on npmjs.com: account settings, Staged Packages (needs 2FA)."
          else
            # A registry refusal shows as a warning, not a failed release: the tag and the GitHub
            # release above are done. Run this workflow again by hand once npm accepts the package.
            echo "::warning title=npm publish refused::$name@$v was neither published nor staged (publish exit $code, stage exit $staged). The lines above say why. The GitHub release is done; run Release again by hand once npm accepts the package."
          fi

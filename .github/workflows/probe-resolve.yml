name: probe resolveReviewThread permission
# Temporary: which GITHUB_TOKEN permission resolveReviewThread needs. Resolves one thread of the
# merged PR #46 and reopens it at once, so nothing is left changed.
on:
  push:
    branches: [probe-resolve-permission]
jobs:
  pull-requests-write:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          T=PRRT_kwDOVjc7ks62C4T4
          echo "resolve:"; gh api graphql -f query="mutation{resolveReviewThread(input:{threadId:\"$T\"}){thread{isResolved}}}"
          echo "unresolve:"; gh api graphql -f query="mutation{unresolveReviewThread(input:{threadId:\"$T\"}){thread{isResolved}}}"
          exit 0
  plus-contents-write:
    needs: pull-requests-write
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          T=PRRT_kwDOVjc7ks62C4T4
          echo "resolve:"; gh api graphql -f query="mutation{resolveReviewThread(input:{threadId:\"$T\"}){thread{isResolved}}}"
          echo "unresolve:"; gh api graphql -f query="mutation{unresolveReviewThread(input:{threadId:\"$T\"}){thread{isResolved}}}"
          exit 0
